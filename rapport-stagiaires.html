<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapport des stagiaires</title>
  <style>
    :root {
      --bg: #f0f3f7;
      --surface: #ffffff;
      --ink: #1a2332;
      --muted: #5c6b7a;
      --line: #d8e0e8;
      --accent: #0d6e6e;
      --accent-soft: #e6f3f3;
      --header: #14303a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(ellipse at top left, #dce8ef 0%, transparent 45%),
        radial-gradient(ellipse at bottom right, #e8f0e8 0%, transparent 40%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 2rem 1.25rem 3rem;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.75rem;
    }

    header .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      font-weight: 700;
      color: var(--header);
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-size: 0.875rem;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: #0a5858;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(20, 48, 58, 0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--header);
      color: #f5f8fa;
    }

    th {
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.9rem 1rem;
      white-space: nowrap;
    }

    td {
      padding: 0.85rem 1rem;
      border-top: 1px solid var(--line);
      font-size: 0.925rem;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: var(--accent-soft);
    }

    tbody tr:nth-child(even) {
      background: #f7fafb;
    }

    tbody tr:nth-child(even):hover {
      background: var(--accent-soft);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .table-wrap {
        overflow-x: auto;
      }

      table {
        min-width: 640px;
      }
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }

      .actions {
        display: none;
      }

      .table-wrap {
        box-shadow: none;
        border: 1px solid #ccc;
      }

      thead {
        background: #14303a !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="eyebrow">Gestion des stagiaires</div>
      <h1>Rapport des stagiaires</h1>
      <p>Liste des stagiaires avec leurs coordonnées et période de stage.</p>
    </header>

    <div class="toolbar">
      <div class="meta">
        <span id="count">0 stagiaire(s)</span>
        · Généré le <span id="generated-at"></span>
      </div>
      <div class="actions">
        <button type="button" onclick="window.print()">Imprimer</button>
        <button type="button" class="primary" onclick="exportCsv()">Exporter CSV</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Tél</th>
            <th>Email</th>
            <th>Date début</th>
            <th>Date fin</th>
          </tr>
        </thead>
        <tbody id="stagiaires-body">
          <!-- Rempli par JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Données d'exemple — remplacez par vos données (API, PHP, etc.)
    const stagiaires = [
      {
        nom: "Amina Diallo",
        tel: "+221 77 123 45 67",
        email: "amina.diallo@email.com",
        dateDebut: "2026-01-15",
        dateFin: "2026-04-15"
      },
      {
        nom: "Jean Dupont",
        tel: "+33 6 12 34 56 78",
        email: "jean.dupont@email.com",
        dateDebut: "2026-02-01",
        dateFin: "2026-07-31"
      },
      {
        nom: "Sophie Martin",
        tel: "+33 7 98 76 54 32",
        email: "sophie.martin@email.com",
        dateDebut: "2026-03-10",
        dateFin: "2026-06-10"
      }
    ];

    function formatDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function render() {
      const tbody = document.getElementById("stagiaires-body");
      document.getElementById("count").textContent =
        stagiaires.length + " stagiaire(s)";
      document.getElementById("generated-at").textContent =
        new Date().toLocaleDateString("fr-FR", {
          day: "2-digit",
          month: "long",
          year: "numeric"
        });

      if (!stagiaires.length) {
        tbody.innerHTML =
          '<tr><td colspan="5" class="empty">Aucun stagiaire à afficher.</td></tr>';
        return;
      }

      tbody.innerHTML = stagiaires
        .map(
          (s) => `
        <tr>
          <td>${escapeHtml(s.nom)}</td>
          <td>${escapeHtml(s.tel)}</td>
          <td><a href="mailto:${escapeHtml(s.email)}">${escapeHtml(s.email)}</a></td>
          <td>${formatDate(s.dateDebut)}</td>
          <td>${formatDate(s.dateFin)}</td>
        </tr>`
        )
        .join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function exportCsv() {
      const header = ["nom", "tel", "email", "dateDebut", "dateFin"];
      const rows = stagiaires.map((s) =>
        header
          .map((key) => `"${String(s[key] ?? "").replace(/"/g, '""')}"`)
          .join(",")
      );
      const csv = [header.join(","), ...rows].join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rapport-stagiaires.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    render();
  </script>
</body>
</html>
